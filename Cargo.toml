[package]
name = "vaabbit"

version = "0.1.0"
edition = "2021"

[target.x86_64-unknown-linux-gnu] 
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
opt-level = 3
debug = true

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
debug = false
codegen-units = 1

[dependencies]
anymap = "*"
glam = { version = "0.30.9", default-features = true, features = [] }
smallvec = "1.15.1"
ulid = "*"
vibarena = "1.0.1"
rustc-hash = "2.1.3"
nohash-hasher = "*"

[dev-dependencies]
macroquad = { version = "*" }
vibbit = { path = "../vibbit" }
